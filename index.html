const STORAGE_PREFIX = 'DizimosAssembleiaDB_';
const readStore = (storeName) => {
    try {
        const raw = localStorage.getItem(STORAGE_PREFIX + storeName);
        if (!raw)
            return [];
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
    }
    catch (error) {
        console.error(`Erro ao ler ${storeName}:`, error);
        return [];
    }
};
const writeStore = (storeName, items) => {
    localStorage.setItem(STORAGE_PREFIX + storeName, JSON.stringify(items));
};
const dbOp = async (storeName, operation, data = null) => {
    const items = readStore(storeName);
    if (operation === 'getAll' || operation === 'get')
        return items;
    if (operation === 'put') {
        const index = items.findIndex((item) => item.id === data.id);
        if (index >= 0)
            items[index] = data;
        else
            items.push(data);
        writeStore(storeName, items);
        return data;
    }
    if (operation === 'delete') {
        writeStore(storeName, items.filter((item) => item.id !== data));
        return undefined;
    }
    if (operation === 'clear') {
        writeStore(storeName, []);
        return undefined;
    }
    return items;
};
